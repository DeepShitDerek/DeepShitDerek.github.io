name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Default permissions for all jobs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ============================================================
  # BUILD + QUALITY GATES
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------

      - name: Verify package lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for CI."
            exit 1
          fi

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.[mc]js', '**/*.[mc]ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Static analysis / quality gates
      # --------------------------------------------------------

      - name: Check Radix packages share their internals
        run: node scripts/check-radix-dedupe.mjs

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Lint
        run: npx --no-install eslint src --max-warnings 0

      - name: Audit dependencies
        run: node scripts/check-audit.mjs

      - name: Run tests
        run: npx --no-install vitest run

      - name: Check theme contrast
        run: node scripts/theme-contrast.mjs

      # --------------------------------------------------------
      # Database tests
      # --------------------------------------------------------

      - name: Run database policy tests
        run: node scripts/test-db.mjs

      - name: Check live database schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/check-live-schema.mjs

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BUCKET_NAME: ${{ secrets.NEXT_PUBLIC_BUCKET_NAME }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      # --------------------------------------------------------
      # Verify generated static site
      # --------------------------------------------------------

      - name: Verify static export
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Next.js did not generate the out/ directory."
            echo "Make sure next.config.* contains: output: 'export'"
            exit 1
          fi

          if [ ! -f "out/index.html" ]; then
            echo "::error::out/index.html was not generated."
            exit 1
          fi

          echo "Static export verified:"
          du -sh out
          find out -maxdepth 2 -type f | head -50

      - name: Check prerendered content
        run: node scripts/check-prerender.mjs

      - name: Check hydration
        run: node scripts/check-hydration.mjs

      - name: Check bundle budget
        run: node scripts/check-bundle-budget.mjs

      # --------------------------------------------------------
      # Lighthouse
      # --------------------------------------------------------

      - name: Check Lighthouse budget
        continue-on-error: true
        env:
          REPORT: lighthouse-report.json
        run: node scripts/check-lighthouse.mjs

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: ignore

      # --------------------------------------------------------
      # GitHub Pages artifact
      # --------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  # ============================================================
  # BROWSER / E2E / ACCESSIBILITY CHECKS
  # ============================================================
  browser-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for CI."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build with dev harness
        env:
          NEXT_PUBLIC_DEV_HARNESS: "1"
          TZ: UTC
        run: npm run build

      - name: Check accessibility
        run: node scripts/check-a11y.mjs

      - name: Check the money module
        run: node scripts/check-money.mjs

      - name: Check the Maps editor
        run: node scripts/check-maps.mjs

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    runs-on: ubuntu-latest

    needs:
      - build
      - browser-checks

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4